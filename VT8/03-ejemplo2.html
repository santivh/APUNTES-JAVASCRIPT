<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo 2</title>
    <link rel="stylesheet" href="03-ejemplo2.css">
</head>
<body>
    <form action="03-ejemplo2.html" method="POST"> 
        <fieldset> 
            <legend>Datos de Usuario</legend>
            <p>Usuario: <input type="text" name="usuario" id="nombre"></p>
            <p>Contraseña: <input type="password" name="contrasena" id="contrasena"></p>
        </fieldset>
        <fieldset>
            <legend>Datos Personales</legend>
            <p>Fecha de Nacimiento <input type="date" name="fecha" id="fecha"><span id="mensajeFecha"></span></p>
            <label>Género: </label> 
            <p><input type="radio" name="genero" value="Hombre">Hombre</p> 
            <p><input type="radio" name="genero" value="Mujer">Mujer</p>
            <p><input type="radio" name="genero" value="Otro">Otro</p>

            <label for="niveles">Nivel Educativo</label>
            <select name="niveles" id="niveles">
                <option value="ESO">Secundaria</option>
                <option value="BACH">Bachillerato</option>
                <option value="FP">Formación Profesional</option>
                <option value="UNI">Universitario</option>
            </select>
            <p>Adjunta tu DNI: <input type="file" name="DNI"></p>   
        </fieldset>
        <fieldset>
            <legend>Política de privacidad</legend>
            <p><input type="checkbox" name="terminos" value="aceptaTerminos">Acepto los términos de uso</p> 
            <p><input type="checkbox" name="publicidad" value="aceptaPubli">Acepto recibir publicidad</p>
        </fieldset>
        <br>
        <input type="submit" name="enviar" value="Enviar formulario"> 
    </form>
    <script type="text/javascript" src="03-ejemplo2.js"></script>
</body>
</html>
